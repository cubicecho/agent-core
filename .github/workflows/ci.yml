name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      # `prepare` builds on install, so a package that no longer compiles fails
      # here rather than at publish time, and there is no separate build step
      # below for it to fail in.
      - run: npm ci

      # Formatting, lint, and import order in one pass. `ci` differs from
      # `npm run lint` only in never writing fixes.
      - name: Lint
        run: npx biome ci .

      # The build above compiles src/ alone — tsconfig.build.json excludes the
      # tests. This is the pass that puts tests/ through the compiler, via
      # tsconfig.tests.json. It has to be that project explicitly: the default
      # tsconfig.json excludes `**/*.test.ts`, and vitest transpiles without
      # checking, so plain `tsc --noEmit` type-checked none of the suite.
      - name: Typecheck
        run: npm run typecheck

      # Coverage rather than a bare run, so the summary is in the log for a
      # reviewer to read. Deliberately no threshold: a number that fails a build
      # gets met by whatever test raises it fastest, which is not the same as
      # being tested. What it is for is noticing a module that stops being.
      - name: Test
        run: npm run coverage

      # `files` is ["dist"] and dist is gitignored, so every git-URL consumer
      # builds this themselves from `prepare`. A build that succeeds while
      # emitting nothing would leave them with an exports map pointing at a
      # dist/ that is not there — which is how the prepack-instead-of-prepare
      # bug reached a consumer rather than this repo.
      - name: The build actually emitted
        run: test -f dist/index.js && test -f dist/index.d.ts
