name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Formatting, lint, and import order in one pass. `ci` differs from
      # `npm run check:biome` in never writing fixes.
      - name: Lint
        run: npx biome ci .

      # The pass that puts tests/ and bench/ through the compiler as well as
      # src/: vitest transpiles without checking, and the build compiles src/
      # alone.
      - name: Typecheck
        run: npm run check:types

      # Coverage rather than a bare run, so the summary is in the log for a
      # reviewer to read. Deliberately no threshold: a number that fails a build
      # gets met by whatever test raises it fastest, which is not the same as
      # being tested. What it is for is noticing a module that stops being.
      - name: Test
        run: npm run coverage

      # The build runs on `prepack`, so nothing has built yet. Doing it here
      # means a package that no longer compiles fails on the pull request
      # rather than at publish time.
      - name: Build
        run: npm run build

      # The build regenerates llms.txt, so this asks git whether the
      # regenerated file matches the committed one. `npm run llms:check` would
      # pass unconditionally here, having just written the file it compares.
      - name: llms.txt matches the exports it indexes
        run: git diff --exit-code -- llms.txt

      # A build that succeeds while emitting nothing would publish an exports
      # map pointing at a dist/ that is not there.
      - name: The build actually emitted
        run: test -f dist/index.js && test -f dist/index.d.ts
