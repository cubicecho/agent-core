name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      # `prepare` builds on install, so a package that no longer compiles fails
      # here rather than at publish time, and there is no separate build step
      # below for it to fail in.
      - run: npm ci

      # Formatting, lint, and import order in one pass. `ci` differs from
      # `npm run lint` only in never writing fixes.
      - name: Lint
        run: npx biome ci .

      # The build above compiles src/ alone — tsconfig.build.json excludes the
      # tests. This is the pass that puts tests/ through the compiler.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
